# Local Postgres for development. Start with: docker compose up -d
# Then set DATABASE_URI=postgres://postgres:postgres@127.0.0.1:5432/theodenanyoh_web_dev
services:
  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theodenanyoh_web_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
